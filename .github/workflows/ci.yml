name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_db"
          SECRET_KEY: "test-secret-key-for-github-actions-ci-2026"
          ENVIRONMENT: "development"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
        run: |
          PYTHONPATH=backend pytest backend/tests -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build

  container-validate:
    name: Container & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Production Docker Compose
        run: |
          docker compose -f deploy/docker-compose.prod.yml config

      - name: Validate Dockerfile Syntax
        run: |
          docker build --dry-run backend/ -f backend/Dockerfile
          docker build --dry-run frontend/ -f frontend/Dockerfile

  k8s-helm-lint:
    name: Kubernetes & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: |
          pip install pyyaml

      - name: Validate Kubernetes Manifests Syntax
        run: |
          python -c "import yaml, glob; [list(yaml.safe_load_all(open(f, encoding='utf-8'))) for f in sorted(glob.glob('deploy/k8s/*.yaml'))]; print('All K8s manifests syntax valid!')"

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/consulting-deck
