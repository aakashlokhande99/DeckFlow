# Alembic configuration file
# This file is read by Alembic at migration time.
# DATABASE_URL is overridden at runtime in env.py from the environment variable.

[alembic]
script_location = app/db/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# Placeholder — overridden in env.py from DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://consulting:consulting@localhost:5432/consulting_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
