apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consulting-backend-hpa
  namespace: consulting-prod
  labels:
    app: consulting-backend
    app.kubernetes.io/part-of: consulting-deck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consulting-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consulting-worker-hpa
  namespace: consulting-prod
  labels:
    app: consulting-worker
    app.kubernetes.io/part-of: consulting-deck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consulting-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
