apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: consulting-artifacts-pvc
  namespace: consulting-prod
  labels:
    app.kubernetes.io/part-of: consulting-deck
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: consulting-prod
  labels:
    app.kubernetes.io/part-of: consulting-deck
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
