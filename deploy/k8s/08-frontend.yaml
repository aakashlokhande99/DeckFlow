apiVersion: apps/v1
kind: Deployment
metadata:
  name: consulting-frontend
  namespace: consulting-prod
  labels:
    app: consulting-frontend
    tier: frontend
    app.kubernetes.io/part-of: consulting-deck
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consulting-frontend
  template:
    metadata:
      labels:
        app: consulting-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: consulting-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: consulting-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: consulting-frontend-svc
  namespace: consulting-prod
  labels:
    app: consulting-frontend
    app.kubernetes.io/part-of: consulting-deck
spec:
  type: ClusterIP
  selector:
    app: consulting-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
