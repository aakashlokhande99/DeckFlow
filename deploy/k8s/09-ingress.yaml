apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consulting-ingress
  namespace: consulting-prod
  labels:
    app.kubernetes.io/part-of: consulting-deck
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "consulting-backend-svc"
spec:
  rules:
    - host: consulting.enterprise.internal
      http:
        paths:
          - path: /api/ws
            pathType: Prefix
            backend:
              service:
                name: consulting-backend-svc
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: consulting-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: consulting-frontend-svc
                port:
                  number: 3000
