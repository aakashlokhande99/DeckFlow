apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consulting-postgres
  namespace: consulting-prod
  labels:
    app: consulting-postgres
    app.kubernetes.io/part-of: consulting-deck
spec:
  serviceName: consulting-postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: consulting-postgres
  template:
    metadata:
      labels:
        app: consulting-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: consulting-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: consulting-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: consulting-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: consulting-postgres-svc
  namespace: consulting-prod
  labels:
    app: consulting-postgres
    app.kubernetes.io/part-of: consulting-deck
spec:
  type: ClusterIP
  selector:
    app: consulting-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
