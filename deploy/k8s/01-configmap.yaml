apiVersion: v1
kind: ConfigMap
metadata:
  name: consulting-config
  namespace: consulting-prod
  labels:
    app.kubernetes.io/part-of: consulting-deck
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "openai"
  SEARCH_PROVIDER: "serpapi"
  DATABASE_URL: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@consulting-postgres-svc:5432/$(POSTGRES_DB)"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@consulting-redis-svc:6379/0"
  CELERY_BROKER_URL: "redis://:$(REDIS_PASSWORD)@consulting-redis-svc:6379/0"
  CELERY_RESULT_BACKEND: "redis://:$(REDIS_PASSWORD)@consulting-redis-svc:6379/0"
  NEXT_PUBLIC_API_URL: "http://consulting-backend-svc:8000"
