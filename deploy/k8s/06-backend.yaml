apiVersion: apps/v1
kind: Deployment
metadata:
  name: consulting-backend
  namespace: consulting-prod
  labels:
    app: consulting-backend
    tier: api
    app.kubernetes.io/part-of: consulting-deck
spec:
  replicas: 3
  selector:
    matchLabels:
      app: consulting-backend
  template:
    metadata:
      labels:
        app: consulting-backend
        tier: api
    spec:
      containers:
        - name: backend
          image: consulting-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: consulting-config
            - secretRef:
                name: consulting-secrets
          volumeMounts:
            - name: artifacts-volume
              mountPath: /app/artifacts
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: artifacts-volume
          persistentVolumeClaim:
            claimName: consulting-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: consulting-backend-svc
  namespace: consulting-prod
  labels:
    app: consulting-backend
    app.kubernetes.io/part-of: consulting-deck
spec:
  type: ClusterIP
  selector:
    app: consulting-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
