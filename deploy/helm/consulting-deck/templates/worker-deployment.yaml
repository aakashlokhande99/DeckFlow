apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "consulting-deck.fullname" . }}-worker
  labels:
    {{- include "consulting-deck.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "consulting-deck.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "consulting-deck.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: {{ include "consulting-deck.fullname" . }}-config
            - secretRef:
                name: {{ include "consulting-deck.fullname" . }}-secrets
          volumeMounts:
            - name: artifacts-volume
              mountPath: /app/artifacts
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A app.worker.celery_app inspect ping -d celery@$HOSTNAME --timeout=5
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A app.worker.celery_app inspect ping -d celery@$HOSTNAME --timeout=5
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: artifacts-volume
          persistentVolumeClaim:
            claimName: {{ include "consulting-deck.fullname" . }}-artifacts-pvc
