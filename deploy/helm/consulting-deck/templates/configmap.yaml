apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "consulting-deck.fullname" . }}-config
  labels:
    {{- include "consulting-deck.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  LLM_PROVIDER: {{ .Values.env.LLM_PROVIDER | quote }}
  SEARCH_PROVIDER: {{ .Values.env.SEARCH_PROVIDER | quote }}
  DATABASE_URL: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "consulting-deck.fullname" . }}-postgres-svc:{{ .Values.service.postgres.port }}/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@{{ include "consulting-deck.fullname" . }}-redis-svc:{{ .Values.service.redis.port }}/0"
  CELERY_BROKER_URL: "redis://:$(REDIS_PASSWORD)@{{ include "consulting-deck.fullname" . }}-redis-svc:{{ .Values.service.redis.port }}/0"
  CELERY_RESULT_BACKEND: "redis://:$(REDIS_PASSWORD)@{{ include "consulting-deck.fullname" . }}-redis-svc:{{ .Values.service.redis.port }}/0"
  NEXT_PUBLIC_API_URL: "http://{{ include "consulting-deck.fullname" . }}-backend-svc:{{ .Values.service.backend.port }}"
