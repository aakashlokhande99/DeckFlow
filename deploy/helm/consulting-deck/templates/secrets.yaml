apiVersion: v1
kind: Secret
metadata:
  name: {{ include "consulting-deck.fullname" . }}-secrets
  labels:
    {{- include "consulting-deck.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  SERPAPI_API_KEY: {{ .Values.secrets.SERPAPI_API_KEY | quote }}
  SERPAPI_KEY: {{ .Values.secrets.SERPAPI_KEY | quote }}
